<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="وب‌سایت گردشگری">
  <defs>
    <linearGradient id="tSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7b267"/>
      <stop offset="45%" stop-color="#f4845f"/>
      <stop offset="100%" stop-color="#3f3d7a"/>
    </linearGradient>
    <linearGradient id="tWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f4858"/>
      <stop offset="100%" stop-color="#16232e"/>
    </linearGradient>
    <linearGradient id="tFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101418" stop-opacity="0"/>
      <stop offset="100%" stop-color="#101418" stop-opacity=".72"/>
    </linearGradient>
    <clipPath id="tClip"><rect width="800" height="600" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#tClip)">
